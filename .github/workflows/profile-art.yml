name: Profile artwork check

# The README banners, separators, tarot cards and hub posters are generated by
# tools/profile-art from design/19_mystical-western. This regenerates them,
# verifies every GIF is animated, loops and has a seamless seam, checks every
# image the README references, and warns if the committed artwork is stale.
# It never commits.
on:
  push:
    branches: [main]
    paths:
      - 'design/19_mystical-western/**'
      - 'tools/profile-art/**'
      - 'tools/theme/smoke.mjs'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/profile-art.yml'
  pull_request:
    paths:
      - 'design/19_mystical-western/**'
      - 'tools/profile-art/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Design tokens match the palette
        run: node design/19_mystical-western/build-tokens.mjs --check
      - name: Install generator and checker
        run: |
          npm ci --prefix tools/profile-art
          npm ci --prefix tools/theme
      - name: Regenerate artwork
        run: npm run build --prefix tools/profile-art
      - name: Verify artwork and README references
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run check --prefix tools/profile-art
      - name: Warn if committed artwork is stale
        run: |
          changed=$(git status --porcelain -- assets arcade/media site/public)
          if [ -n "$changed" ]; then
            echo "::warning::Regenerated artwork differs from the committed files (font rasterisation can differ by platform). Run 'npm run build' in tools/profile-art and commit if the change is intended."
            echo "$changed"
          else
            echo "Committed artwork matches a fresh build."
          fi
