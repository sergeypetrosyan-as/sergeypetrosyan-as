name: UNFALL build check

# Type-checks and builds the UNFALL game. GitHub Pages serves this repository
# from `main` / root, so this never deploys; it warns if the committed
# `games/unfall/` bundle is stale.
on:
  push:
    branches: [main]
    paths:
      - 'source/unfall/**'
      - 'games/unfall/**'
      - '.github/workflows/unfall-build.yml'
  pull_request:
    paths:
      - 'source/unfall/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/unfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/unfall/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check committed bundle is up to date
        working-directory: .
        run: |
          if git status --porcelain -- games/unfall | grep -q .; then
            echo "::warning::The committed games/unfall/ bundle differs from a fresh build. Run 'npm run build' in source/unfall and commit games/unfall/."
            git status --short -- games/unfall
          else
            echo "games/unfall/ matches a fresh build."
          fi
