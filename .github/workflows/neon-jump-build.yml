name: NEON JUMP build check

# Validates the levels, type-checks and builds NEON JUMP. GitHub Pages serves this
# repository from `main` / root, so this never deploys; it warns if the committed
# `games/neon-jump/` bundle is stale.
on:
  push:
    branches: [main]
    paths:
      - 'source/neon-jump/**'
      - 'games/neon-jump/**'
      - '.github/workflows/neon-jump-build.yml'
  pull_request:
    paths:
      - 'source/neon-jump/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/neon-jump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/neon-jump/package-lock.json
      - run: npm ci
      - run: npm run check:levels
      - run: npm run build
      - name: Check committed bundle is up to date
        working-directory: .
        run: |
          if git status --porcelain -- games/neon-jump | grep -q .; then
            echo "::warning::The committed games/neon-jump/ bundle differs from a fresh build. Run 'npm run build' in source/neon-jump and commit games/neon-jump/."
            git status --short -- games/neon-jump
          else
            echo "games/neon-jump/ matches a fresh build."
          fi
