name: MYSTICAL WESTERN JUMP build check

# Validates the levels, type-checks and builds MYSTICAL WESTERN JUMP. GitHub Pages serves this
# repository from `main` / root, so this never deploys; it warns if the committed
# `games/mystical-western-jump/` bundle is stale.
on:
  push:
    branches: [main]
    paths:
      - 'source/mystical-western-jump/**'
      - 'design/19_mystical-western/**'
      - 'games/mystical-western-jump/**'
      - '.github/workflows/mystical-western-jump-build.yml'
  pull_request:
    paths:
      - 'source/mystical-western-jump/**'
      - 'design/19_mystical-western/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/mystical-western-jump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/mystical-western-jump/package-lock.json
      - run: npm ci
      - run: npm run check:levels
      - run: npm run build
      - name: Check committed bundle is up to date
        working-directory: .
        run: |
          if git status --porcelain -- games/mystical-western-jump | grep -q .; then
            echo "::warning::The committed games/mystical-western-jump/ bundle differs from a fresh build. Run 'npm run build' in source/mystical-western-jump and commit games/mystical-western-jump/."
            git status --short -- games/mystical-western-jump
          else
            echo "games/mystical-western-jump/ matches a fresh build."
          fi
