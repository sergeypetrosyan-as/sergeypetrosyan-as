name: NEON VICE build check

# Type-checks and builds the 3D game. GitHub Pages serves this repository
# straight from `main`, so this workflow never deploys — it only verifies that
# the source compiles and that the committed `neon-vice/` bundle is current.
on:
  push:
    branches: [main]
    paths:
      - 'games/neon-vice-city/**'
      - 'neon-vice/**'
      - '.github/workflows/neon-vice-build.yml'
  pull_request:
    paths:
      - 'games/neon-vice-city/**'
      - 'neon-vice/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/neon-vice-city
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/neon-vice-city/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check committed bundle is up to date
        working-directory: .
        run: |
          if git status --porcelain -- neon-vice | grep -q .; then
            echo "::warning::The committed neon-vice/ bundle differs from a fresh build. Run 'npm run build' in games/neon-vice-city and commit neon-vice/."
            git status --short -- neon-vice
          else
            echo "neon-vice/ matches a fresh build."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: neon-vice-dist
          path: neon-vice
          retention-days: 7
