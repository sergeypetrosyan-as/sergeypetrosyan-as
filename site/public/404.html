<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#150607" />
  <title>404 — Off the map | MYSTICAL WESTERN ARCADE</title>
  <link rel="icon" href="/sergeypetrosyan-as/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Rye&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet" />
  <style>
    /* Colours: design/19_mystical-western (night #150607, dusk #320B0E, mesa #480E13, bone #F1EDE7, ash #A5A29E, red #E30016, ember #AB0B1A, rose #E96B74) */
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif; color: #F1EDE7;
      background: linear-gradient(#030303, #150607 55%, #320B0E); }
    .moon { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%; background: #F1EDE7; border: 3px solid #AB0B1A;
      box-shadow: inset -54px 0 0 0 #320B0E; }
    h1 { margin: 0; font: 400 clamp(3.5rem, 16vw, 7rem)/1 'Rye', Georgia, serif; text-shadow: 0 3px 0 #72151D; }
    p { color: #A5A29E; margin: 16px 0 32px; font-size: 1.05rem; }
    a { display: inline-block; padding: 14px 24px; border-radius: 10px; color: #fff; text-decoration: none;
      font: 700 1rem/1 'Zilla Slab', Georgia, serif; background: #E30016; border: 2px solid #E30016;
      box-shadow: inset 0 0 0 3px #E30016, inset 0 0 0 4px rgba(241, 237, 231, .55); }
    a:hover { background: #AB0B1A; border-color: #AB0B1A; }
    a:focus-visible { outline: 2px solid #E96B74; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true"></div>
    <h1>404</h1>
    <p>This trail runs off the map.</p>
    <a href="/sergeypetrosyan-as/">Back to the arcade</a>
  </main>
</body>
</html>
